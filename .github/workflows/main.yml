name: Daily Market Analysis
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs at 13:30 UTC every weekday (7:00 PM IST)
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime (auto-catches up missed Mon-Fri days)

permissions:
  contents: write

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Create Output Directories
        run: mkdir -p Report/EMAReport

      - name: Run Market Analysis (with Mon-Fri Catch-Up)
        run: python Scripts/run_with_catchup.py

      - name: Push to Google Sheets
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GSHEET_CREDS_JSON: ${{ secrets.GSHEET_CREDS_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Scripts/push_to_gsheet.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Automated Market Report Update: $(TZ='Asia/Kolkata' date +'%Y-%m-%d')" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
